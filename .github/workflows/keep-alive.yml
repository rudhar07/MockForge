# Render's free tier puts a web service to sleep after 15 minutes without
# traffic, and the next visitor waits ~30-60s for a cold start. Pinging the
# lightweight /health endpoint (no DB call) every 10 minutes keeps it warm.
#
# Note: GitHub may delay scheduled runs under load, and disables schedules
# in public repos after 60 days with no repository activity.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (UTC)
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 15 \
            https://mockforge-h8jw.onrender.com/health
